<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>907Hustle: One Good Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="./game-core.js"></script>
  <style>
    :root {
      --black:#070707; --panel:#111; --panel2:#181818; --panel3:#202020;
      --line:#333; --muted:#9b9b9b; --white:#f2f0eb; --red:#d32920;
      --red2:#ff4a3d; --green:#73b867; --amber:#e1a63a; --cyan:#79bbc1;
      --head:"Anton",Impact,sans-serif; --ui:"Barlow Condensed",Arial,sans-serif;
      --mono:"Share Tech Mono",monospace;
    }
    * { box-sizing:border-box; }
    html,body,#root { height:100%; margin:0; }
    body {
      background:
        repeating-linear-gradient(118deg,rgba(255,255,255,.018) 0 1px,transparent 1px 7px),
        radial-gradient(circle at 20% 0,rgba(211,41,32,.11),transparent 35%),var(--black);
      color:var(--white);font-family:var(--ui);overflow:hidden;
    }
    button,input { font:inherit; }
    button { touch-action:manipulation; }
    .app { height:100dvh;max-width:900px;margin:auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto; }
    .top { padding:10px 12px 8px;border-top:4px solid var(--red);border-bottom:1px solid var(--line);background:rgba(9,9,9,.97); }
    .brand-row { display:flex;align-items:center;gap:10px; }
    .brand { font-family:var(--head);font-size:1.35rem;letter-spacing:.1em;line-height:1;text-transform:uppercase; }
    .brand b { color:var(--red2);font-weight:400; }
    .brand small { display:block;font-family:var(--ui);font-size:.55rem;letter-spacing:.22em;color:var(--muted);margin-top:4px; }
    .menu-btn { margin-left:auto;min-width:48px;min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--white);font-weight:700;text-transform:uppercase;letter-spacing:.08em; }
    .hud { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:9px; }
    .hud-item { min-width:0;padding:6px 7px;border:1px solid var(--line);background:var(--panel); }
    .hud-item .k { display:block;color:var(--muted);font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase; }
    .hud-item .v { display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:.74rem;margin-top:2px; }
    .hud-item.danger { border-color:#72231e;color:var(--red2); }
    .hud-item.good { border-color:#365c31;color:var(--green); }
    .nav { display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:4px 5px;background:#090909;border-bottom:1px solid var(--line); }
    .nav button { min-width:0;min-height:48px;padding:5px 2px;border:1px solid transparent;background:var(--panel);color:#868686;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em; }
    .nav button.active { color:var(--white);border-color:var(--red);background:linear-gradient(#28100e,var(--panel)); }
    .main { min-height:0;overflow:hidden;display:flex;flex-direction:column; }
    .page-head { padding:10px 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#38110e,var(--panel)); }
    .page-head h1 { font-family:var(--head);font-weight:400;font-size:1.05rem;letter-spacing:.13em;text-transform:uppercase;margin:0; }
    .page-head p { margin:2px 0 0;color:#b7b7b7;font-size:.7rem;letter-spacing:.06em; }
    .scroll { min-height:0;overflow-y:auto;padding:9px 10px 18px;overscroll-behavior:contain; }
    .card { border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),#101010);padding:11px;margin-bottom:8px; }
    .card-title { display:flex;align-items:baseline;gap:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em; }
    .card-title small { margin-left:auto;color:var(--muted);font-weight:600; }
    .muted { color:var(--muted); }
    .good { color:var(--green)!important; }.bad { color:var(--red2)!important; }.warn { color:var(--amber)!important; }
    .market-grid { display:grid;grid-template-columns:1.25fr .75fr .55fr .55fr;gap:6px;align-items:center; }
    .market-head { padding:2px 10px 5px;color:#777;font-size:.58rem;text-transform:uppercase;letter-spacing:.1em; }
    .product { min-height:69px;cursor:pointer;position:relative;overflow:hidden; }
    .product::before { content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#555; }
    .product.signal-high::before,.product.signal-up::before { background:var(--green); }
    .product.signal-low::before,.product.signal-down::before { background:var(--red); }
    .product-name { font-family:var(--head);font-size:.92rem;letter-spacing:.08em;text-transform:uppercase; }
    .role { color:var(--muted);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em; }
    .price { font-family:var(--mono);font-size:1rem; }
    .signal { font-size:.6rem;font-weight:700;text-transform:uppercase; }
    .own { text-align:center;font-family:var(--mono);border:1px solid var(--line);padding:4px; }
    .btn { min-height:44px;border:1px solid var(--line);background:var(--panel3);color:var(--white);padding:8px 11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;cursor:pointer; }
    .btn:disabled { opacity:.32;cursor:not-allowed; }
    .btn.primary { background:linear-gradient(#d63a30,#8f1711);border-color:#ef5146; }
    .btn.good-btn { background:linear-gradient(#42713a,#244b20);border-color:#5f9256; }
    .btn.secondary { background:linear-gradient(#292929,#161616); }
    .btn.full { width:100%; }
    .btn-row { display:flex;gap:7px; }.btn-row .btn { flex:1; }
    .action-bar { display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:5px max(6px,env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));border-top:1px solid var(--line);background:#080808; }
    .action-bar .btn { min-height:52px;padding:5px;font-size:.69rem; }
    .action-bar small { display:block;font-weight:600;color:#b9b9b9;font-size:.56rem;margin-top:2px; }
    .area-card { border-left:4px solid var(--accent,#777); }
    .area-meta { display:flex;gap:12px;margin:7px 0;color:var(--muted);font-size:.68rem;text-transform:uppercase; }
    .inventory-row,.money-row,.person-row { display:flex;align-items:center;gap:10px; }
    .inventory-row > div:first-child,.person-row > div:first-child { flex:1; }
    .big { font-family:var(--head);font-size:1.45rem;letter-spacing:.04em; }
    .meter { height:8px;background:#080808;border:1px solid var(--line);margin-top:6px; }
    .meter span { display:block;height:100%;background:var(--red); }
    .field-row { display:flex;gap:6px;margin-top:8px; }
    input { min-width:0;min-height:44px;flex:1;background:#090909;border:1px solid var(--line);color:var(--white);padding:8px;font-family:var(--mono);font-size:1rem; }
    .rumor { border-left:3px solid var(--cyan); }
    .feed { max-height:88px;overflow-y:auto;border-top:1px solid var(--line);background:#0c0c0c;padding:6px 10px; }
    .feed-line { font-size:.66rem;color:#aaa;padding:2px 0 2px 7px;border-left:2px solid #444; }
    .feed-line.good { border-color:var(--green); }.feed-line.bad { border-color:var(--red); }.feed-line.warn { border-color:var(--amber); }
    .feed-line time { color:#666;font-family:var(--mono);margin-right:6px; }
    .final-banner { margin:0 0 9px;border:2px solid var(--red);background:linear-gradient(135deg,#3d0d09,#111);padding:12px; }
    .final-banner h2 { margin:0;font-family:var(--head);font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--red2); }
    .final-banner p { margin:4px 0 10px;color:#ccc;font-size:.75rem; }
    .modal-backdrop { position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:14px; }
    .modal { width:min(470px,100%);max-height:92dvh;overflow-y:auto;border:1px solid #555;border-top:4px solid var(--red);background:#111;padding:16px;box-shadow:0 20px 80px #000; }
    .modal h2 { font-family:var(--head);font-weight:400;letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px; }
    .modal p { color:#bbb;line-height:1.45; }
    .trade-stats { display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0; }
    .trade-stat { border:1px solid var(--line);padding:8px; }.trade-stat small { display:block;color:var(--muted);text-transform:uppercase; }.trade-stat b { font-family:var(--mono); }
    .debt-card { border-color:#65302b;background:linear-gradient(145deg,#241210,#101010); }
    .debt-kicker { color:#c5b3ae;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase; }
    .debt-amount { margin:3px 0 1px;font-family:var(--head);font-size:2.15rem;line-height:1;letter-spacing:.04em;color:var(--red2); }
    .debt-meta { display:flex;flex-wrap:wrap;gap:5px 12px;margin:8px 0;color:#c9c9c9;font-size:.72rem; }
    .loan-details { margin-top:10px;border-top:1px solid var(--line);padding-top:8px; }
    .loan-details summary { min-height:44px;display:flex;align-items:center;color:var(--cyan);cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.07em; }
    .loan-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:4px 0 8px; }
    .loan-grid > div { border:1px solid var(--line);padding:7px; }
    .loan-grid small { display:block;color:var(--muted);text-transform:uppercase; }
    .loan-history { margin:6px 0 0;padding-left:18px;color:#bbb;font-size:.72rem; }
    .cleared-card { border-color:#365c31;background:linear-gradient(145deg,#152213,#101010); }
    .cleared-card .debt-amount { color:var(--green); }
    .action-copy { display:block;color:#c5c5c5;font-size:.62rem;margin-top:2px;letter-spacing:.03em;text-transform:none; }
    .qty { display:grid;grid-template-columns:52px 52px minmax(70px,1fr) 52px 52px 64px;gap:5px;margin:10px 0; }
    .qty .btn { padding:6px;font-size:1rem; }
    .trade-preview { display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0; }
    .trade-preview > div { border:1px solid var(--line);padding:7px;min-width:0; }
    .trade-preview small { display:block;color:var(--muted);font-size:.62rem;text-transform:uppercase; }
    .trade-preview b { display:block;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:.8rem; }
    .outcome-grid { display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0; }
    .outcome { border:1px solid var(--line);padding:9px; }.outcome b { display:block;font-family:var(--mono);font-size:1.05rem; }
    .ending-title { color:var(--red2);font-size:1.8rem!important;text-align:center; }
    .recap { font-size:.72rem;color:#aaa;border-left:3px solid var(--red);padding-left:9px;margin:10px 0; }
    @media (max-width:520px) {
      .top { padding:8px 8px 6px; }
      .brand { font-size:1.08rem; }
      .hud { grid-template-columns:repeat(4,minmax(0,1fr)); }
      .hud-item { padding:5px 4px; }.hud-item .v { font-size:.65rem; }
      .nav { grid-template-columns:repeat(6,minmax(0,1fr)); }
      .market-grid { grid-template-columns:1.15fr .7fr .55fr .48fr;gap:3px; }
      .product { padding:10px 7px; }.price { font-size:.85rem; }.signal { font-size:.53rem; }
      .feed { max-height:76px; }
      .field-row.payment-row { display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(100px,.85fr); }
      .qty { grid-template-columns:44px minmax(44px,1fr) 44px 44px 48px;gap:4px; }
      .qty .qty-wide { display:none; }
    }
    @media (max-width:350px) {
      .brand small { display:none; }
      .hud-item:nth-child(8) { display:none; }
      .nav { grid-template-columns:repeat(6,minmax(0,1fr)); }
      .trade-preview { grid-template-columns:1fr 1fr; }
      .trade-preview > div:last-child { grid-column:1/-1; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useReducer,useState} = React;
const C = window.GameCore;

function loadRun(){
  try {
    const raw=localStorage.getItem(C.SAVE_KEY);
    const parsed=raw?JSON.parse(raw):null;
    if(parsed?.version===C.VERSION && parsed?.run && parsed?.world) return parsed;
  } catch {}
  return C.createRun({seed:Date.now()});
}

function Header({state,onMenu}){
  const area=C.NEIGHBORHOODS.find(a=>a.id===state.world.currentNeighborhoodId);
  const cargo=C.selectors.cargoUsed(state);
  const band=C.selectors.heatBand(state.player.heat);
  return <header className="top">
    <div className="brand-row">
      <div className="brand">907<b>Hustle</b><small>One Good Run</small></div>
      <button className="menu-btn" onClick={onMenu} aria-label="Open run menu">Menu</button>
    </div>
    <div className="hud">
      <Hud k="Day" v={`${state.run.day}/7 · ${C.SLOTS[state.run.slot]}`} />
      <Hud k="Area" v={area.name} />
      <Hud k="Cash" v={`$${state.player.cash}`} good />
      <Hud k="Debt" v={state.lender.balance?`$${state.lender.balance}`:"Clear"} danger={state.run.day>=state.lender.dueDay&&state.lender.balance>0} />
      <Hud k="Health" v={`${state.player.health}/100`} danger={state.player.health<40} />
      <Hud k="Heat" v={`${state.player.heat} · ${band.label}`} danger={state.player.heat>=8} />
      <Hud k="Cargo" v={`${cargo}/${state.player.cargoCapacity}`} danger={cargo>=state.player.cargoCapacity} />
      <Hud k="Banked" v={`$${state.player.banked}`} />
    </div>
  </header>
}
function Hud({k,v,danger,good}){return <div className={`hud-item${danger?" danger":""}${good?" good":""}`}><span className="k">{k}</span><span className="v">{v}</span></div>}

function dreRead(state){
  if(!state.lender.balance) return "Dre has stopped checking the clock. When you call, he answers.";
  if(state.run.day>state.lender.dueDay) return "Dre's messages are short now. He expects action, not an explanation.";
  if(state.lender.payments>0) return "Dre noticed the money moving. He is watching whether you keep your word.";
  return "Dre fronted the week and expects to be remembered before it gets late.";
}
function rookRead(state){
  if(state.rival.respect>=4&&state.rival.pressure<=6) return "Rook sends the address without asking for anything first.";
  if(state.rival.pressure>=12) return "Rook's people have stopped pretending the run is beneath them.";
  if(state.rival.pressure>=7) return "Rook keeps hearing your name in lanes he considers his.";
  if(state.rival.respect>=2) return "Rook gives you room, though he still watches what you do with it.";
  return "Rook has heard your name. So far, he has not bothered to answer it.";
}

const NAV=[
  ["market","Market"],["travel","Travel"],["stash","Stash"],["money","Cash + Debt"],["people","People"],["services","Services"]
];
function Navigation({tab,setTab}){return <nav className="nav" aria-label="Primary game navigation">{NAV.map(([id,label])=><button key={id} className={tab===id?"active":""} onClick={()=>setTab(id)}>{label}</button>)}</nav>}
function PageHead({title,sub}){return <div className="page-head"><h1>{title}</h1><p>{sub}</p></div>}

function FinalDay({state,dispatch}){
  if(state.run.day!==7||state.run.status!=="playing") return null;
  return <div className="final-banner"><h2>Day 7: The Final Push</h2><p>Protect what you built or put the whole week behind one last move.</p><div className="btn-row"><button className="btn secondary" onClick={()=>dispatch({type:"FINISH_SAFE"})}>Protect the run</button><button className="btn primary" onClick={()=>dispatch({type:"FINAL_RISK"})}>Take final risk</button></div></div>
}

function Market({state,dispatch,onTrade}){
  const areaId=state.world.currentNeighborhoodId;
  const area=C.NEIGHBORHOODS.find(a=>a.id===areaId);
  const market=state.world.markets[areaId];
  return <><PageHead title="Street Market" sub={`${area.name} · prices stay fixed while you trade`} /><div className="scroll">
    <FinalDay state={state} dispatch={dispatch}/>
    <div className="market-grid market-head"><span>Product</span><span>Price</span><span>Signal</span><span>Own</span></div>
    {C.PRODUCTS.map(product=>{
      const signal=C.selectors.priceSignal(state,areaId,product.id);
      const item=state.player.inventory[product.id];
      return <div key={product.id} className={`card product market-grid signal-${signal.id}`} onClick={()=>onTrade(product.id)} role="button" tabIndex="0" aria-label={`Trade ${product.name}`}>
        <div><div className="product-name">{product.name}</div><div className="role">{product.role} · {market.availability[product.id]} available</div></div>
        <div className="price">${market.prices[product.id]}</div>
        <div className={`signal ${signal.id==="high"||signal.id==="up"?"good":signal.id==="low"||signal.id==="down"?"bad":""}`}>{signal.symbol} {signal.label}</div>
        <div className="own">{item.qty}</div>
      </div>
    })}
  </div></>
}

function Travel({state,dispatch,setTab}){
  return <><PageHead title="Travel" sub="Travel costs 1 time slot"/><div className="scroll"><FinalDay state={state} dispatch={dispatch}/>{C.NEIGHBORHOODS.map(area=>{
    const current=area.id===state.world.currentNeighborhoodId;
    return <div className="card area-card" style={{"--accent":area.accent}} key={area.id}>
      <div className="card-title"><span>{area.name}</span><small>{area.role}{current?" · HERE":""}</small></div>
      <p className="muted">{area.blurb}</p><div className="area-meta"><span>Risk {area.risk}/4</span><span>Police {area.police}/3</span><span>Rival {area.rival}/3</span></div>
      <button className="btn full primary" disabled={current} onClick={()=>{dispatch({type:"TRAVEL",neighborhoodId:area.id});setTab("market")}}>{current?"Current neighborhood":`Travel to ${area.name}`}</button>
    </div>
  })}</div></>
}

function Stash({state,onTrade}){
  const held=C.PRODUCTS.filter(p=>state.player.inventory[p.id].qty>0);
  return <><PageHead title="Stash" sub={`${C.selectors.cargoUsed(state)}/${state.player.cargoCapacity} cargo · $${C.selectors.inventoryValue(state)} local liquidation value`}/><div className="scroll">
    {!held.length&&<div className="card muted">Your bag is empty. Buy at the current market before the block moves.</div>}
    {held.map(product=>{const item=state.player.inventory[product.id];return <div className="card inventory-row" key={product.id}><div><div className="card-title">{product.name}</div><div className="muted">Average cost ${Math.round(item.avgCost)} · sell through the market</div></div><div className="big">{item.qty}</div><button className="btn secondary" onClick={()=>onTrade(product.id)}>Trade</button></div>})}
  </div></>
}

function Money({state,dispatch}){
  const [pay,setPay]=useState(""); const [bank,setBank]=useState("");
  const worth=C.selectors.netWorth(state);
  const loan=C.selectors.loanDetails(state);
  const paymentMax=Math.min(state.player.cash,state.lender.balance);
  const paymentLog=[...loan.paymentHistory.map(p=>({kind:"Paid",...p})),...loan.penaltyHistory.map(p=>({kind:"Fee",...p}))].sort((a,b)=>(b.day*4+b.slot)-(a.day*4+a.slot));
  const details=<details className="loan-details"><summary>View loan details</summary><div className="loan-grid"><div><small>Original note</small><b>${loan.principal}</b></div><div><small>Fees added</small><b>${loan.feesAdded}</b></div><div><small>Total repaid</small><b>${loan.repaid}</b></div><div><small>Payments made</small><b>{loan.paymentCount}</b></div></div>{paymentLog.length?<ul className="loan-history">{paymentLog.slice(0,6).map((entry,i)=><li key={`${entry.kind}-${entry.day}-${entry.slot}-${i}`}>{entry.kind} ${entry.amount} · Day {entry.day} {C.SLOTS[entry.slot]}</li>)}</ul>:<p className="muted">No payments or fees recorded yet.</p>}</details>;
  return <><PageHead title="Cash + Debt" sub={`Net worth $${worth}`}/><div className="scroll"><FinalDay state={state} dispatch={dispatch}/>
    <div className="card"><div className="money-row"><div><span className="muted">Street cash</span><div className="big good">${state.player.cash}</div></div><div style={{marginLeft:"auto",textAlign:"right"}}><span className="muted">Banked safe</span><div className="big">${state.player.banked}</div></div></div></div>
    {state.lender.balance>0?<div className="card debt-card"><div className="debt-kicker">You owe Dre</div><div className="debt-amount">${state.lender.balance}</div><div className="debt-meta"><span>Due Day {state.lender.dueDay} · Night</span><span>{dreRead(state)}</span></div><div className="field-row payment-row"><input aria-label="Debt payment amount" type="number" min="1" max={paymentMax} placeholder="Payment" value={pay} onChange={e=>setPay(e.target.value)}/><button className="btn secondary" disabled={!paymentMax} onClick={()=>setPay(paymentMax)}>MAX</button><button className="btn primary" disabled={!Number(pay)||Number(pay)>paymentMax} onClick={()=>{dispatch({type:"PAY_DEBT",amount:Number(pay)});setPay("")}}>Pay Dre<span className="action-copy">Costs 1 slot</span></button></div>{details}</div>
    :<div className="card cleared-card"><div className="debt-kicker">Dre's note</div><div className="debt-amount">Paid in full</div><p>{dreRead(state)}</p><p className="muted">The debt is closed. Protect cash, rebuild health, grow the bag, or prepare for the final day—the week still has somewhere to go.</p>{details}</div>}
    <div className="card"><div className="card-title">Move money to safety</div><p className="muted">Banked money stays off the street. Move only what you can afford to spend time handling.</p><div className="field-row"><input aria-label="Bank amount" type="number" min="1" placeholder="Amount" value={bank} onChange={e=>setBank(e.target.value)}/><button className="btn good-btn" disabled={!Number(bank)||Number(bank)>state.player.cash} onClick={()=>{dispatch({type:"BANK",amount:Number(bank)});setBank("")}}>Bank<span className="action-copy">Costs 1 slot</span></button><button className="btn secondary" disabled={!Number(bank)||Number(bank)>state.player.banked} onClick={()=>{dispatch({type:"UNBANK",amount:Number(bank)});setBank("")}}>Pull<span className="action-copy">Costs 1 slot</span></button></div></div>
  </div></>
}

function People({state,dispatch}){
  return <><PageHead title="People" sub="Relationships change the run, not just the dialogue"/><div className="scroll"><FinalDay state={state} dispatch={dispatch}/>
    <div className="card person-row"><div><div className="card-title">Dre Holloway</div><p className="muted">{dreRead(state)}</p></div></div>
    <div className="card person-row"><div><div className="card-title">Rook Mercer</div><p className="muted">{rookRead(state)}</p></div></div>
    <div className="card"><div className="card-title">Late-Night Mini-Mart + Overlook <small>Costs 1 slot</small></div><p className="muted">Catch a rumor, cross paths with Dre or Rook, or spend precious time hearing nothing useful.</p><button className="btn full primary" onClick={()=>dispatch({type:"VISIT_SOCIAL"})}>Visit the Mini-Mart</button></div>
    {state.effects.rumors.map(r=><div key={r.id} className="card rumor"><div className="card-title">Street rumor <small>{r.reliable?"credible":"uncertain"}</small></div><div>{r.text}</div></div>)}
  </div></>
}

function Services({state,dispatch}){
  const heals=[{name:"First aid",amount:18,cost:55},{name:"Clinic visit",amount:40,cost:135},{name:"No-questions doctor",amount:75,cost:290}];
  return <><PageHead title="Services" sub="Recovery costs cash and one time slot"/><div className="scroll"><FinalDay state={state} dispatch={dispatch}/>
    <div className="card"><div className="card-title"><span>Health</span><small className={state.player.health<40?"bad":""}>{state.player.health}/100</small></div><div className="meter"><span style={{width:`${state.player.health}%`,background:state.player.health<40?"var(--red)":"var(--green)"}}/></div></div>
    {heals.map(h=><div className="card inventory-row" key={h.name}><div><div className="card-title">{h.name}</div><div className="muted">Restore up to {h.amount} health</div></div><div className="big">${h.cost}</div><button className="btn good-btn" disabled={state.player.cash<h.cost||state.player.health>=100} onClick={()=>dispatch({type:"HEAL",amount:h.amount,cost:h.cost})}>Heal</button></div>)}
    <div className="card"><div className="card-title">Lay low <small>1 slot</small></div><p className="muted">Cool heat and rival pressure while debt and the markets continue moving.</p><button className="btn full secondary" onClick={()=>dispatch({type:"LAY_LOW"})}>Lay low until {C.SLOTS[state.run.slot===3?0:state.run.slot+1]}</button></div>
  </div></>
}

function Feed({entries}){return <div className="feed" aria-label="Street feed">{entries.slice(0,8).map((entry,i)=><div key={i} className={`feed-line ${entry.tone||""}`}><time>{entry.stamp}</time>{entry.text}</div>)}</div>}

function TradeModal({state,productId,dispatch,onClose}){
  const [mode,setMode]=useState("buy"); const [qty,setQty]=useState(1);
  const product=C.PRODUCTS.find(p=>p.id===productId); if(!product)return null;
  const market=state.world.markets[state.world.currentNeighborhoodId]; const item=state.player.inventory[productId];
  const price=market.prices[productId]; const available=market.availability[productId];
  const maxBuy=Math.max(0,Math.min(available,state.player.cargoCapacity-C.selectors.cargoUsed(state),Math.floor(state.player.cash/price)));
  const max=mode==="buy"?maxBuy:item.qty; const safe=Math.max(1,Math.min(qty,Math.max(1,max)));
  const selected=max<1?0:safe;
  const sellPrice=Math.round(price*(.96+Math.min(.03,state.player.reputation*.002))); const profit=(sellPrice-item.avgCost)*selected;
  const unitPrice=mode==="buy"?price:sellPrice; const total=unitPrice*selected;
  const remainingCash=mode==="buy"?state.player.cash-total:state.player.cash+total;
  const remainingCargo=mode==="buy"?state.player.cargoCapacity-C.selectors.cargoUsed(state)-selected:state.player.cargoCapacity-C.selectors.cargoUsed(state)+selected;
  return <div className="modal-backdrop"><div className="modal"><h2>{product.name} Trade</h2><p>Prices stay locked until you end this market visit.</p><div className="btn-row"><button className={`btn ${mode==="buy"?"good-btn":"secondary"}`} onClick={()=>{setMode("buy");setQty(1)}}>Buy</button><button className={`btn ${mode==="sell"?"primary":"secondary"}`} onClick={()=>{setMode("sell");setQty(1)}}>Sell</button></div>
    <div className="trade-stats"><div className="trade-stat"><small>{mode==="buy"?"Buy":"Sell"} price</small><b>${mode==="buy"?price:sellPrice}</b></div><div className="trade-stat"><small>{mode==="buy"?"Available":"You own"}</small><b>{mode==="buy"?available:item.qty}</b></div></div>
    <div className="qty"><button className="btn secondary qty-wide" disabled={max<1} onClick={()=>setQty(Math.max(1,safe-5))}>−5</button><button className="btn secondary" disabled={max<1} onClick={()=>setQty(Math.max(1,safe-1))}>−</button><input aria-label="Trade quantity" type="number" value={selected} min={max<1?0:1} max={Math.max(1,max)} disabled={max<1} onChange={e=>setQty(Math.max(1,Math.min(Math.max(1,max),Math.floor(Number(e.target.value)||1))))}/><button className="btn secondary" disabled={max<1} onClick={()=>setQty(Math.min(Math.max(1,max),safe+1))}>+</button><button className="btn secondary" disabled={max<1} onClick={()=>setQty(Math.min(Math.max(1,max),safe+5))}>+5</button><button className="btn secondary" disabled={max<1} onClick={()=>setQty(max)}>MAX</button></div>
    {mode==="sell"&&item.qty>0&&<div className={profit>=0?"good":"bad"}>{profit>=0?"Projected profit":"Projected loss"}: {profit>=0?"+":"−"}${Math.abs(Math.round(profit))}</div>}
    <div className="trade-preview"><div><small>Total</small><b>${total}</b></div><div><small>Cash after</small><b>${remainingCash}</b></div><div><small>Cargo space after</small><b>{remainingCargo}</b></div></div>
    <div className="btn-row"><button className="btn secondary" onClick={onClose}>Cancel</button><button className={`btn ${mode==="buy"?"good-btn":"primary"}`} disabled={max<1} onClick={()=>{dispatch({type:mode==="buy"?"BUY":"SELL",productId,qty:selected});onClose()}}>{mode==="buy"?"Buy":"Sell"} {selected}</button></div>
  </div></div>
}

function EventModal({event,dispatch}){return <div className="modal-backdrop"><div className="modal"><h2>{event.title}</h2><p>{event.description}</p>{event.choices.map((choice,i)=><button className="btn full secondary" style={{marginTop:7}} key={choice.label} onClick={()=>dispatch({type:"RESOLVE_EVENT",choiceIndex:i})}>{choice.label}</button>)}</div></div>}
function DayModal({summary,dispatch}){return <div className="modal-backdrop"><div className="modal"><h2>End of Day {summary.day}</h2><div className="outcome-grid"><Outcome k="Net worth" v={`$${summary.netWorth}`}/><Outcome k="Debt" v={`$${summary.debt}`}/><Outcome k="Heat" v={summary.heat}/><Outcome k="Health" v={summary.health}/></div><button className="btn full primary" onClick={()=>dispatch({type:"DISMISS_DAY_SUMMARY"})}>Start Day {summary.day+1}</button></div></div>}
function Outcome({k,v}){return <div className="outcome"><span className="muted">{k}</span><b>{v}</b></div>}
function EndModal({state,dispatch}){const s=C.selectRunSummary(state);return <div className="modal-backdrop"><div className="modal"><h2 className="ending-title">{s.endingLabel}</h2><p style={{textAlign:"center"}}>Seven days in Anchorage. This is what survived the week.</p><div className="outcome-grid"><Outcome k="Final cash" v={`$${s.cash}`}/><Outcome k="Banked" v={`$${s.banked}`}/><Outcome k="Debt" v={`$${s.debt}`}/><Outcome k="Net worth" v={`$${s.netWorth}`}/><Outcome k="Best trade" v={`$${s.bestTrade}`}/><Outcome k="Largest loss" v={`$${Math.round(s.largestLoss)}`}/><Outcome k="Highest heat" v={s.highestHeat}/><Outcome k="Products moved" v={Object.values(s.productsMoved).reduce((a,b)=>a+b,0)}/></div><div className="recap">{dreRead(state)} {rookRead(state)} {s.majorDecisions.slice(-2).join(" ")||"You let the market make the final statement."}</div><button className="btn full primary" onClick={()=>dispatch({type:"NEW_RUN",seed:Date.now()})}>Start another run</button></div></div>}
function MenuModal({state,dispatch,onClose}){return <div className="modal-backdrop"><div className="modal"><h2>Run Menu</h2><p>Your focused run auto-saves after every decision. The old 30-day save remains untouched.</p><button className="btn full primary" onClick={()=>{dispatch({type:"NEW_RUN",seed:Date.now()});onClose()}}>New seven-day run</button><button className="btn full secondary" style={{marginTop:7}} onClick={onClose}>Return to run</button><p className="muted">Seed {state.run.seed} · Core v{state.version}</p></div></div>}

function App(){
  const [state,dispatch]=useReducer(C.reduceGame,null,loadRun); const [tab,setTab]=useState("market"); const [trade,setTrade]=useState(null); const [menu,setMenu]=useState(false);
  useEffect(()=>{try{localStorage.setItem(C.SAVE_KEY,JSON.stringify(state))}catch{}},[state]);
  useEffect(()=>{if(state.run.status==="ended")setTrade(null)},[state.run.status]);
  const screen={market:<Market state={state} dispatch={dispatch} onTrade={setTrade}/>,travel:<Travel state={state} dispatch={dispatch} setTab={setTab}/>,stash:<Stash state={state} onTrade={setTrade}/>,money:<Money state={state} dispatch={dispatch}/>,people:<People state={state} dispatch={dispatch}/>,services:<Services state={state} dispatch={dispatch}/>}[tab];
  return <div className="app"><Header state={state} onMenu={()=>setMenu(true)}/><Navigation tab={tab} setTab={setTab}/><main className="main">{screen}</main><div><Feed entries={state.log}/><div className="action-bar"><button className="btn secondary" onClick={()=>setTab("travel")}>Travel<small>Choose a neighborhood</small></button><button className="btn primary" onClick={()=>dispatch({type:"END_MARKET"})}>End Market<small>Costs 1 slot</small></button><button className="btn secondary" onClick={()=>dispatch({type:"LAY_LOW"})}>Lay Low<small>Costs 1 slot</small></button></div></div>
    {trade&&<TradeModal state={state} productId={trade} dispatch={dispatch} onClose={()=>setTrade(null)}/>} {menu&&<MenuModal state={state} dispatch={dispatch} onClose={()=>setMenu(false)}/>} {state.run.daySummary&&state.run.status==="playing"&&<DayModal summary={state.run.daySummary} dispatch={dispatch}/>} {!state.run.daySummary&&state.run.pendingEvent&&state.run.status==="playing"&&<EventModal event={state.run.pendingEvent} dispatch={dispatch}/>} {state.run.status==="ended"&&<EndModal state={state} dispatch={dispatch}/>} </div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
